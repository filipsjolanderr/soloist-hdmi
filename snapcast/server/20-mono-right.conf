# One speaker, wired to the RIGHT channel of the 3.5mm jack.
#
# This publishes a sink with a single MONO channel, which soloist targets by
# name. PipeWire's channel mixer downmixes anything stereo played into it at
# 0.5*FL + 0.5*FR - both channels are kept, and a centred mix cannot clip - and
# the loopback then places that one channel at FR on the hardware sink.
#
# stream.dont-remix is what makes it one channel rather than two: without it
# PipeWire would helpfully copy the single channel to both FL and FR, which is
# exactly what we do not want. With it the link is positional, FR to FR, and FL
# is left as digital silence.
#
# Targeting this sink by name also means playback does not care which sink is
# the system default - if an HDMI sink ever appears and WirePlumber switches the
# default over, soloist still lands here.
#
# alsa_output.platform-fe00b840.mailbox.stereo-fallback is substituted by install.sh: the node name carries the SoC
# address (fe00b840 on a Pi 4, different elsewhere) so it cannot be committed.
context.modules = [
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Aux Mono Right"
            capture.props = {
                node.name        = "aux_mono_right"
                node.description = "Aux Mono Right"
                media.class      = Audio/Sink
                audio.position   = [ MONO ]
            }
            playback.props = {
                node.name         = "aux_mono_right.output"
                audio.position    = [ FR ]
                node.target       = "alsa_output.platform-fe00b840.mailbox.stereo-fallback"
                stream.dont-remix = true
                node.passive      = true
            }
        }
    }
]
