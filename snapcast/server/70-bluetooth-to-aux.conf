# Send Bluetooth audio to the mono speaker sink, not straight to the DAC.
#
# A phone or Nest Hub streaming *to* this box arrives as a
# Stream/Output/Audio named bluez_input.<MAC>.<n> - a playback stream, like any
# application, NOT an Audio/Source. It therefore follows normal stream policy
# and lands on the default sink.
#
# With the default sink set to the USB DAC that meant Bluetooth went out in
# stereo, straight past aux_mono_right, so everything panned left was thrown
# away - the speaker is only on the right channel. Pinning target.object routes
# it through the mono sink instead, which downmixes 0.5*FL + 0.5*FR first and
# keeps both halves of the mix.
#
# Done as a rule rather than by relying on the default sink, so that changing
# the default later cannot silently send Bluetooth somewhere else.
monitor.bluez.rules = [
  {
    matches = [ { node.name = "~bluez_input.*" } ]
    actions = { update-props = { target.object = "aux_mono_right" } }
  }
]
