# A sink that writes raw PCM straight into snapserver's FIFO.
#
# The usual recipe for this is a null sink plus a pw-record/parec process
# capturing its monitor. pipe-tunnel does it in one object with no capture
# process to supervise, and no WAV header to strip off the front of the stream -
# snapserver's pipe source expects raw PCM and would play a header as a click.
#
# The format is pinned to exactly what snapserver is told to expect
# (44100:16:2). Spotify streams at 44.1 kHz, so this is also the rate that
# avoids a resample; see 10-hifi-aux.conf.
context.modules = [
    {   name = libpipewire-module-pipe-tunnel
        args = {
            tunnel.mode   = sink
            pipe.filename = "/run/snapcast/spotify.fifo"
            audio.format   = S16LE
            audio.rate     = 44100
            audio.channels = 2
            audio.position = [ FL FR ]
            stream.props = {
                node.name        = "snapcast_spotify"
                node.description = "Snapcast: Spotify"
                media.class      = Audio/Sink
            }
        }
    }
]
