# Keep the analog output at unity instead of +4 dB.
#
# The bcm2835 "PCM" control runs from -102.39 dB to +4.00 dB, and WirePlumber
# maps a sink volume of 1.00 onto the TOP of that range. So the HDMI box's
# design - sink at 1.00, no digital attenuation, let the amplifier do the work -
# ported literally puts +4 dB of digital BOOST on the DAC and clips.
#
# api.alsa.soft-mixer moves volume into software, so the hardware control is
# never written and stays wherever alsactl restored it, which install.sh pins at
# 0 dB. A software volume of 1.00 is a no-op multiply, so this is still the
# no-attenuation path - the attenuation is the amplifier's job, as before.
#
# Both matches are needed and they are not redundant. Volume reaches the card by
# two paths, the node's mixer and the device's route, and the device route is
# the one that actually bites. The two objects are also matched on different
# keys: alsa.card_name is not yet populated on the device when device rules run,
# only api.alsa.card.name is. Matching the card by name rather than by node name
# keeps this free of the SoC address, so it is the one file here that does not
# need substituting per board.
monitor.alsa.rules = [
  {
    matches = [
      { api.alsa.card.name = "bcm2835 Headphones" }
      { alsa.card_name     = "bcm2835 Headphones" }
    ]
    actions = { update-props = { api.alsa.soft-mixer = true } }
  }
]
