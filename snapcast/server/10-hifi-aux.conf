# Spotify streams at 44.1 kHz and PipeWire defaults to 48 kHz, which would
# resample every track. The bcm2835 analog device accepts 44.1 kHz directly -
# /proc/asound/card0/pcm0p/sub0/hw_params reports `rate: 44100` with no plug
# layer interposed - so ask the graph for it and the resampler drops out.
#
# The USB DAC now on this box is 48 kHz ONLY (/proc/asound/card*/stream0 reports
# a single rate), so its endpoint does resample - once, inside the ALSA node.
# The graph deliberately stays at 44100 anyway: that keeps the source, the FIFO
# feeding snapserver, and the HDMI room all native, and confines the conversion
# to the one device that cannot avoid it. Moving the graph to 48000 would
# resample for every room instead of just this one.
context.properties = {
    default.clock.rate          = 44100
    default.clock.allowed-rates = [ 44100 48000 ]

    # Latency is irrelevant for one-way playback, so a large quantum is free.
    # Note this is NOT the Pi Zero 2 W rationale from the HDMI box - a Pi 4 has
    # four cores and 4 GB and is under no pressure. It is kept because there is
    # no reason to wake up more often, not because the board cannot cope.
    default.clock.quantum       = 2048
    default.clock.min-quantum   = 1024
    default.clock.max-quantum   = 4096
}
