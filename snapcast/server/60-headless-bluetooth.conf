# Start the Bluetooth monitor on a box with no seat.
#
# bluez.lua gates the monitor on logind seat state and creates it only when the
# state is exactly "active":
#
#     if seat_state == "active" then monitor = createMonitor() end
#
# This box is headless. loginctl enable-linger gives it a user manager with no
# login session and no seat, so the state is "online" and never "active" - the
# monitor is therefore never created. Nothing logs an error, because on a
# desktop this is correct behaviour; the only visible symptom is that BlueZ
# advertises no Audio Sink (0000110b) UUID, so phones and Google Home devices do
# not see a speaker to pair with at all.
#
# Turning seat monitoring off makes bluez.lua take its other branch and create
# the monitor unconditionally, which is what an appliance wants.
wireplumber.profiles = {
  main = {
    support.logind = disabled
    monitor.bluez.seat-monitoring = disabled
  }
}
