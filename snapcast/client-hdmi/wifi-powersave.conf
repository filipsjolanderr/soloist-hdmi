# The brcmfmac default is power save ON, which parks the radio between beacons
# and turns a 2 ms LAN round trip into an occasional 70 ms one. Snapcast's time
# sync request times out on those spikes and the client tears down the whole
# session and reconnects - about twice a minute - and every reconnect stops and
# restarts the player, which is a few seconds of silence.
#
# 2 = disable. This box is mains powered and is a speaker; there is nothing to
# save power for.
[connection]
wifi.powersave = 2
