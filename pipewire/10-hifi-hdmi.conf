# Spotify streams at 44.1 kHz. PipeWire defaults to 48 kHz, which would force a
# resample on every track. The Sony receiver's EDID advertises LPCM at both
# 44.1 and 48 kHz, so allow PipeWire to switch to the native rate instead.
context.properties = {
    default.clock.rate          = 44100
    default.clock.allowed-rates = [ 44100 48000 ]

    # Pi Zero 2 W is a single-core-ish, memory-tight box. A larger quantum
    # trades a little latency for far fewer wakeups and no xruns. Latency is
    # irrelevant for one-way music playback.
    default.clock.quantum       = 2048
    default.clock.min-quantum   = 1024
    default.clock.max-quantum   = 4096
}
